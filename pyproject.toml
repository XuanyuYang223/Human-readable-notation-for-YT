[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yt-human-readable-transformer"
version = "0.1.0"
description = "Two small Transformers for translating Young-tableau notation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.1"]

[project.scripts]
yt-convert = "yt_transformer.convert:main"
yt-train = "yt_transformer.train:main"
yt-infer = "yt_transformer.infer:main"
yt-evaluate = "yt_transformer.evaluate:main"
yt-ood = "yt_transformer.ood:main"

[tool.setuptools.packages.find]
include = ["yt_transformer*"]
